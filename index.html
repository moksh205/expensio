  <meta name="keywords" content="expense tracker, money manager, finance app, budgeting app" />

  <!-- Open Graph (WhatsApp, LinkedIn) -->
  <meta property="og:title" content="Expensio – Smart Expense Tracker" />
  <meta property="og:description" content="Track expenses, manage money, and save smarter." />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Theme: apply saved/system theme before first paint (no flash) -->
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      var dark = saved ? saved === "dark" : true; // Expensio is black by default
      document.documentElement.classList.toggle("dark", dark);
      document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#000000" : "#f7f6f2");
    })();
  </script>
</head>
  <body>
    <div id="root"></div>
